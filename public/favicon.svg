<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  
  <!-- Clock Circle -->
  <circle cx="50" cy="56" r="28" fill="#0A0F1D" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4 2" />
  
  <!-- Clock Hands -->
  <line x1="50" y1="56" x2="50" y2="38" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="56" x2="64" y2="56" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="50" cy="56" r="4" fill="#FDE047" />

  <!-- Plus Symbol at Top Right -->
  <path d="M72 20 H84 M78 14 V26" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />

  <!-- Graduation Cap (Education) -->
  <path d="M50 20 L24 33 L50 46 L76 33 Z" fill="url(#goldGrad)" />
  <path d="M34 40 V50 Q50 58 66 50 V40" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="76" cy="33" r="2.5" fill="#38BDF8" />
  <path d="M76 33 L80 44" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
</svg>